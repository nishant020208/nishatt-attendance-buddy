<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#4F46E5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bg-grad)" filter="url(#glow)"/>

  <!-- Calendar Base Card Outline -->
  <rect x="100" y="110" width="312" height="292" rx="36" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="6"/>

  <!-- Top Calendar Header Strip -->
  <path d="M100 146 C100 126 116 110 136 110 L376 110 C396 110 412 126 412 146 L412 180 L100 180 Z" fill="#FFFFFF" fill-opacity="0.22"/>

  <!-- Calendar Pins -->
  <rect x="160" y="86" width="28" height="48" rx="14" fill="#FFFFFF"/>
  <rect x="324" y="86" width="28" height="48" rx="14" fill="#FFFFFF"/>

  <!-- Nishatt 'N' Monogram -->
  <path d="M172 230 L172 360 C172 366.6 177.4 372 184 372 L206 372 C212.6 372 218 366.6 218 360 L218 290 L294 366 C297.8 369.8 303.1 372 308.5 372 L326 372 C332.6 372 338 366.6 338 360 L338 230 C338 223.4 332.6 218 326 218 L304 218 C297.4 218 292 223.4 292 230 L292 300 L216 224 C212.2 220.2 206.9 218 201.5 218 L184 218 C177.4 218 172 223.4 172 230 Z" fill="#FFFFFF"/>

  <!-- Attendance Check Badge -->
